name: Install workflow

# Tests what a user does: install into a clean environment as described in the README, run
# SeisSol from Julia and from a shell, install only the binary packages, and run `] test`.

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: ${{ matrix.os }} - Julia ${{ matrix.version }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
          - '1.11'
        os:
          - ubuntu-latest
          - macOS-15-intel
          - windows-latest
        arch:
          - x64
        include:
          - os: macOS-latest
            arch: aarch64
            version: '1'
          - os: macOS-latest
            arch: aarch64
            version: '1.11'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - name: README installation, run_proxy, export_prefix, run from a shell
        shell: bash
        run: julia --color=yes ci/install_readme.jl
      - name: Only the binary packages (SeisSol_jll without SeisSol.jl)
        shell: bash
        run: julia --color=yes ci/install_jll_only.jl
      # Known to fail while the packages are not registered: Pkg's test sandbox cannot handle the
      # [sources] that Pkg.add(url=...) writes (Julia >= 1.11). Not blocking until a registry exists.
      - name: Pkg.test of the installed package
        continue-on-error: true
        shell: bash
        run: julia --color=yes ci/pkg_test.jl

  # Runs the copy-and-paste blocks of the README verbatim, in a clean environment.
  readme-quickstart:
    name: README quick start - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macOS-15-intel
          - macOS-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Extract the README blocks
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            julia ci/readme_block.jl ps-install > "$RUNNER_TEMP/install.ps1"
            julia ci/readme_block.jl ps-run > "$RUNNER_TEMP/run.ps1"
          else
            julia ci/readme_block.jl bash-install > "$RUNNER_TEMP/install.sh"
            julia ci/readme_block.jl bash-run > "$RUNNER_TEMP/run.sh"
          fi
      - name: A. Install (README block)
        if: runner.os != 'Windows'
        shell: bash
        run: bash "$RUNNER_TEMP/install.sh"
      - name: B. Run the example (README block)
        if: runner.os != 'Windows'
        shell: bash
        run: bash "$RUNNER_TEMP/run.sh"
      - name: A. Install (README block, PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cd $env:RUNNER_TEMP; ./install.ps1
      - name: B. Run the example (README block, PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./run.ps1
        working-directory: ${{ runner.temp }}
      - name: Check the result
        shell: bash
        run: |
          f="$HOME/seissol_examples/tpv13/outputs/tpv13-energy.csv"
          test -s "$f" && tail -n 3 "$f"
          grep -q seismic_moment "$f"
          julia ci/check_xdmf.jl "$HOME/seissol_examples/tpv13/outputs"
      - name: Keep the simulation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpv13-outputs-${{ matrix.os }}
          path: ~/seissol_examples/tpv13/outputs
          retention-days: 5
